name: Feature request
description: Suggest an idea or improvement for longcord.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For open-ended ideas or questions, consider starting a Discussion first:
        https://github.com/ansonhhlam/portable-claude/discussions

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like longcord to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Server
        - Web app (PWA)
        - CLI
        - Tailscale setup
        - Model providers (Anthropic API, Bedrock, Vertex AI, Foundry)
        - Documentation
        - Other
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to open a pull request for this.
          required: false
